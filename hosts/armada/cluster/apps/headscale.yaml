# ─── Headscale Config ────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: headscale-config
  namespace: default
data:
  config.yaml: |
    ---
    server_url: https://headscale.${DOMAIN}
    listen_addr: 0.0.0.0:8080
    metrics_listen_addr: 0.0.0.0:9090
    grpc_listen_addr: 127.0.0.1:50443

    noise:
      private_key_path: /var/lib/headscale/noise_private.key

    prefixes:
      v4: 100.64.0.0/10
      v6: fd7a:115c:a1e0::/48

    derp:
      urls:
        - https://controlplane.tailscale.com/derpmap/default
      auto_update_enabled: true

    database:
      type: sqlite
      gorm:
        prepare_stmt: true
        parameterized_queries: true
        skip_err_record_not_found: true
        slow_threshold: 1000
      sqlite:
        path: /var/lib/headscale/db.sqlite

    dns:
      base_domain: ts.${DOMAIN}
      nameservers:
        global:
          - 1.1.1.1
          - 1.0.0.1
          - 2606:4700:4700::1111
          - 2606:4700:4700::1001

    oidc:
      issuer: "https://id.${DOMAIN}"
      client_id: "1736e16a-c3bc-476d-be28-cf65503f899b"
      scope: ["openid", "profile", "email", "groups"]
      email_verified_required: false
      allowed_groups:
        - "headscale"
      pkce:
        enabled: true
---
# ─── Headplane Config ────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: headplane-config
  namespace: default
data:
  config.yaml: |
    ---
    server:
      host: "0.0.0.0"
      port: 3000
      base_url: "https://headscale.${DOMAIN}"
      cookie_secure: true
      data_path: "/var/lib/headplane"

    headscale:
      url: "http://127.0.0.1:8080"
      public_url: "https://headscale.${DOMAIN}"
      config_path: "/etc/headscale/config.yaml"

    integration:
      kubernetes:
        enabled: true
        pod_name: "headscale-0"

    oidc:
      enabled: true
      issuer: "https://id.${DOMAIN}"
      use_pkce: true
      scope: "openid email profile"
---
# ─── Headplane RBAC ──────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headplane
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: headplane
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: headplane
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: headplane
subjects:
  - kind: ServiceAccount
    name: headplane
    namespace: default
---
# ─── Headscale CORS Middleware ───────────────────────────────────────────────
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: headscale-cors
  namespace: default
spec:
  headers:
    accessControlAllowHeaders:
      - "*"
    accessControlAllowMethods:
      - GET
      - POST
      - PUT
    accessControlAllowOriginList:
      - "https://headscale.${DOMAIN}"
    accessControlMaxAge: 100
    addVaryHeader: true
---
# ─── Headscale StatefulSet ───────────────────────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: headscale
  namespace: default
  labels:
    app.kubernetes.io/name: headscale
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/match-tag: "true"
    keel.sh/pollSchedule: "@every 6h"
spec:
  serviceName: headscale
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: headscale
  template:
    metadata:
      labels:
        app.kubernetes.io/name: headscale
    spec:
      shareProcessNamespace: true
      serviceAccountName: headplane
      securityContext:
        fsGroup: 1000
      containers:
        - name: headscale
          image: docker.io/headscale/headscale:latest
          imagePullPolicy: Always
          args:
            - serve
          envFrom:
            - secretRef:
                name: headscale
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/headscale
              readOnly: true
            - name: data
              mountPath: /var/lib/headscale
            - name: run
              mountPath: /var/run/headscale
          resources:
            limits:
              memory: 256Mi
              cpu: 500m
            requests:
              memory: 128Mi
              cpu: 10m
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            exec:
              command:
                - headscale
                - health
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - headscale
                - health
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
        - name: headplane
          image: ghcr.io/tale/headplane:latest
          imagePullPolicy: Always
          env:
            - name: HEADPLANE_LOAD_ENV_OVERRIDES
              value: "true"
          envFrom:
            - secretRef:
                name: headplane
          ports:
            - name: admin
              containerPort: 3000
              protocol: TCP
          volumeMounts:
            - name: headplane-config
              mountPath: /etc/headplane
              readOnly: true
            - name: config
              mountPath: /etc/headscale
              readOnly: true
            - name: headplane-data
              mountPath: /var/lib/headplane
          resources:
            limits:
              memory: 256Mi
              cpu: 500m
            requests:
              memory: 128Mi
              cpu: 10m
          startupProbe:
            exec:
              command:
                - /bin/hp_healthcheck
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - /bin/hp_healthcheck
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: headscale-config
        - name: headplane-config
          configMap:
            name: headplane-config
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
    - metadata:
        name: headplane-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
# ─── Headscale Service ───────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: headscale
  namespace: default
  labels:
    app.kubernetes.io/name: headscale
spec:
  selector:
    app.kubernetes.io/name: headscale
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: admin
      port: 3000
      targetPort: admin
    - name: metrics
      port: 9090
      targetPort: metrics
---
# ─── Headscale Ingress ───────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headscale
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: "Network"
    gethomepage.dev/name: "Headscale"
    gethomepage.dev/icon: "headscale"
    gethomepage.dev/href: "https://headscale.${DOMAIN}/admin"
    gethomepage.dev/description: "Tailscale control server"
    traefik.ingress.kubernetes.io/router.middlewares: default-headscale-cors@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: "headscale.${DOMAIN}"
      http:
        paths:
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: headscale
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: headscale
                port:
                  number: 8080
  tls:
    - secretName: headscale-tls
      hosts:
        - "headscale.${DOMAIN}"
