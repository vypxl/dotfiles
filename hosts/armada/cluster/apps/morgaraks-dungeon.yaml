# Private GHCR credentials and owner setup: see morgaraks-dungeon.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: morgaraks-dungeon
  namespace: default
  labels:
    app.kubernetes.io/name: morgaraks-dungeon
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/match-tag: "true"
    keel.sh/pollSchedule: "@every 6h"
spec:
  replicas: 1
  # Stop the old process before another opens the SQLite database.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: morgaraks-dungeon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: morgaraks-dungeon
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: morgaraks-dungeon
          image: ghcr.io/mars-meyleh/morgaraks-dungeon:main
          imagePullPolicy: Always
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "3000"
            - name: COOKIE_SECURE
              value: "1"
            - name: DB_PATH
              value: /data/dungeon.sqlite
            - name: UPLOAD_DIR
              value: /data/uploads
            - name: THEME_UPLOAD_DIR
              value: /data/theme-submissions
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: morgaraks-dungeon
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: morgaraks-dungeon
  namespace: default
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: morgaraks-dungeon
  namespace: default
  labels:
    app.kubernetes.io/name: morgaraks-dungeon
spec:
  selector:
    app.kubernetes.io/name: morgaraks-dungeon
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: morgaraks-dungeon
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  rules:
    - host: "cirprin-os.meyleh.me"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: morgaraks-dungeon
                port:
                  number: 3000
  tls:
    - secretName: morgaraks-dungeon-tls
      hosts:
        - "cirprin-os.meyleh.me"
